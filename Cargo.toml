[package]
name = "string_theory"
version = "0.1.0"
edition = "2021"

[dependencies]
env_logger = "0.11"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
nalgebra = "0.33"
flate2 = "1.0"

[[bin]]
name = "heuristics"
path = "src/bin/heuristics.rs"

[dev-dependencies]
tempfile = "3.15"
